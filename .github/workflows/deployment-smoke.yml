name: Production deployment smoke

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
       github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test deployed games and assets
        run: npm run test:deployment -- --base-url "$DEPLOYMENT_URL"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-smoke-${{ github.run_id }}
          path: test-results/deployment-smoke.json
          if-no-files-found: warn
